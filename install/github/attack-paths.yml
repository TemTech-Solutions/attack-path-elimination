# Installed from https://github.com/TemTech-Solutions/attack-path-elimination
name: Attack paths

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read
  pull-requests: write

jobs:
  deep-review:
    name: Deep review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Deep review
        uses: TemTech-Solutions/attack-path-elimination@1900173d160f2c376edbee0ba9019b39caeb62d6
        with:
          phase: review
          comment: "false"
          artifact: attack-path-review

  validation:
    name: Validation
    needs: deep-review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download the deep review
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: attack-path-review
          path: attack-paths-report

      - name: Validate findings
        uses: TemTech-Solutions/attack-path-elimination@1900173d160f2c376edbee0ba9019b39caeb62d6
        with:
          phase: validate
          comment: "false"
          artifact: attack-path-validation

  exception-scan:
    name: Exception scan
    needs: validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download the validation
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: attack-path-validation
          path: attack-paths-report

      - name: Publish the report
        uses: TemTech-Solutions/attack-path-elimination@1900173d160f2c376edbee0ba9019b39caeb62d6
        with:
          phase: report
          exception_scan: "true"
          max_critical: "0"
          artifact: attack-path-report
