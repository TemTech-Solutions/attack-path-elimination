# Installed from https://github.com/TemTech-Solutions/attack-path-elimination
name: Attack paths

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read
  pull-requests: write

jobs:
  attack-paths:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Deep scan
        uses: TemTech-Solutions/attack-path-elimination@929c5b639adb8ba7cd85f9046dc6b9f90e770241
        with:
          comment: "false"
          artifact: attack-path-review

      - name: Scan summary
        if: always()
        shell: bash
        run: |
          if [ -f attack-paths-report/summary.md ]; then
            cat attack-paths-report/summary.md
          else
            echo "The scan did not write a summary."
          fi

  exception-scan:
    needs: attack-paths
    runs-on: ubuntu-latest
    steps:
