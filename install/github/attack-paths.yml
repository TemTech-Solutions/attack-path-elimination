# Installed from https://github.com/TemTech-Solutions/attack-path-elimination
name: Attack paths

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read
  pull-requests: write

jobs:
  attack-paths:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Deep scan
        uses: TemTech-Solutions/attack-path-elimination@2283495c574a55ed272f1d959df372137a5deb2f
        with:
          comment: "false"
          artifact: attack-path-review

  exception-scan:
    needs: attack-paths
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Exception scan
        uses: TemTech-Solutions/attack-path-elimination@2283495c574a55ed272f1d959df372137a5deb2f
        with:
          exception_scan: "true"
          artifact: attack-path-report
