name: Attack path elimination
description: Analyze the calling repository in place and publish the attack-path report. The application stays in its own checkout.

inputs:
  path:
    description: Directory inside the repository to analyze
    required: false
    default: "."
  out:
    description: Directory for report.html, graph.json, and pr-comment.md
    required: false
    default: attack-paths-report
  comment:
    description: Update one pull-request comment with the chains
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Require a pinned commit
      shell: bash
      env:
        ACTION_REF: ${{ github.action_ref }}
        ACTION_REPO: ${{ github.action_repository }}
        GH_TOKEN: ${{ github.token }}
      run: |
        if printf '%s' "$ACTION_REF" | grep -Eq '^[0-9a-f]{40}$'; then
          exit 0
        fi
        echo "::error::Pin this action to a full commit SHA. A branch or tag can be moved after review."
        echo "The workflow called ${ACTION_REPO}@${ACTION_REF}."
        if [ -n "$ACTION_REPO" ] && [ -n "$ACTION_REF" ]; then
          sha="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${ACTION_REPO}/commits/${ACTION_REF}" | jq -r '.sha // empty')"
          if printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "Commit this line instead. Later pushes will not change it:"
            echo "  uses: ${ACTION_REPO}@${sha}"
          fi
        fi
        echo "Or copy install/github/attack-paths.yml from the action repository. That file is already pinned."
        exit 1

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: "3.12"

    - name: Analyze this repository
      shell: bash
      run: |
        python -m pip install --upgrade pip
        python -m pip install --quiet -r "${{ github.action_path }}/requirements.txt"
        PYTHONPATH="${{ github.action_path }}" python -m pathfinder analyze "${{ inputs.path }}" --out "${{ inputs.out }}"

    - name: Upload the HTML report
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: attack-path-report
        path: ${{ inputs.out }}
        if-no-files-found: error

    - name: Write the chain into the job summary
      shell: bash
      run: |
        {
          echo "## Attack paths"
          echo
          cat "${{ inputs.out }}/pr-comment.md"
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Comment on the pull request
      if: ${{ inputs.comment == 'true' && github.event_name == 'pull_request' }}
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
        OUT: ${{ inputs.out }}
      run: |
        marker="<!-- pathfinder-attack-paths -->"
        {
          echo "$marker"
          echo
          cat "$OUT/pr-comment.md"
        } > "$RUNNER_TEMP/pathfinder-comment.md"
        existing="$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --jq ".[] | select(.body | contains(\"${marker}\")) | .id" | head -n 1 || true)"
        if [ -n "$existing" ]; then
          jq -n --rawfile body "$RUNNER_TEMP/pathfinder-comment.md" '{body:$body}' > "$RUNNER_TEMP/pathfinder-comment.json"
          gh api --method PATCH "repos/${REPO}/issues/comments/${existing}" --input "$RUNNER_TEMP/pathfinder-comment.json"
        else
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file "$RUNNER_TEMP/pathfinder-comment.md"
        fi
