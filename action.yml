name: Attack path elimination
description: Analyze the calling repository in place and publish the attack-path report. The application stays in its own checkout.

inputs:
  path:
    description: Directory inside the repository to analyze
    required: false
    default: "."
  out:
    description: Directory for report.html, graph.json, and pr-comment.md
    required: false
    default: attack-paths-report
  comment:
    description: Update one pull-request comment with the chains
    required: false
    default: "true"
  exception_scan:
    description: Run the deep scan again and drop recorded exceptions from the published findings
    required: false
    default: "false"
  artifact:
    description: Name of the uploaded report artifact
    required: false
    default: attack-path-report

runs:
  using: composite
  steps:
    - name: Require a release tag or a pinned commit
      shell: bash
      env:
        ACTION_REF: ${{ github.action_ref }}
        ACTION_REPO: ${{ github.action_repository }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        export PYTHONPATH="$ACTION_PATH"
        if command -v python3 >/dev/null 2>&1; then
          py=python3
        else
          py=python
        fi
        if "$py" -c 'import os, sys; from pathfinder.action_ref import ref_is_allowed; sys.exit(0 if ref_is_allowed(os.environ.get("ACTION_REF", "")) else 1)'; then
          exit 0
        fi
        echo "::error::Use a Marketplace release tag such as @v1.0.2, or a full commit SHA. A branch name is refused."
        echo "The workflow called ${ACTION_REPO}@${ACTION_REF}."
        echo "Or copy install/github/attack-paths.yml from the action repository. That file is already pinned to a full commit SHA."
        exit 1

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.12"

    - name: Analyze this repository
      shell: bash
      env:
        EXCEPTION_SCAN: ${{ inputs.exception_scan }}
      run: |
        python -m pip install --upgrade pip
        python -m pip install --quiet -r "${{ github.action_path }}/requirements.txt"
        extra=()
        if [ "$EXCEPTION_SCAN" = "true" ]; then
          extra+=(--exception-scan)
        fi
        PYTHONPATH="${{ github.action_path }}" python -m pathfinder analyze "${{ inputs.path }}" --out "${{ inputs.out }}" "${extra[@]}"

    - name: Upload the HTML report
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.artifact }}
        path: ${{ inputs.out }}
        if-no-files-found: error

    - name: Write the chain into the job summary
      shell: bash
      run: |
        {
          echo "## Attack paths"
          echo
          cat "${{ inputs.out }}/pr-comment.md"
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Comment on the pull request
      if: ${{ inputs.comment == 'true' && github.event_name == 'pull_request' }}
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
        OUT: ${{ inputs.out }}
      run: |
        marker="<!-- pathfinder-attack-paths -->"
        {
          echo "$marker"
          echo
          cat "$OUT/pr-comment.md"
        } > "$RUNNER_TEMP/pathfinder-comment.md"
        existing="$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --jq ".[] | select(.body | contains(\"${marker}\")) | .id" | head -n 1 || true)"
        if [ -n "$existing" ]; then
          jq -n --rawfile body "$RUNNER_TEMP/pathfinder-comment.md" '{body:$body}' > "$RUNNER_TEMP/pathfinder-comment.json"
          gh api --method PATCH "repos/${REPO}/issues/comments/${existing}" --input "$RUNNER_TEMP/pathfinder-comment.json"
        else
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file "$RUNNER_TEMP/pathfinder-comment.md"
        fi
