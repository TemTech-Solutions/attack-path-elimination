<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Attack graph</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #070d18;
    --panel: #10192c;
    --line: #2a3a56;
    --text: #e8eefc;
    --muted: #93a0b8;
    --accent: #7dd3fc;
    --critical: #fb7185;
    --high: #fb923c;
    --medium: #facc15;
    --low: #4ade80;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    height: 100vh;
    display: grid;
    grid-template-rows: auto 1fr;
    background: radial-gradient(1200px 500px at 20% -10%, #1e3a5f 0%, var(--bg) 55%);
    color: var(--text);
    font: 14px/1.45 "Segoe UI", system-ui, sans-serif;
  }
  header { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 10px 14px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 16px; margin: 0; font-weight: 650; }
  header input, header select { background: #0d1526; color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
  a { color: var(--accent); }
  main { display: grid; grid-template-columns: 300px 1fr 400px; min-height: 0; }
  @media (max-width: 1100px) { main { grid-template-columns: 1fr; } aside, #issues { max-height: 34vh; } }
  canvas { width: 100%; height: 100%; display: block; cursor: grab; }
  aside, #issues { overflow: auto; padding: 12px; background: rgba(8, 14, 28, 0.92); }
  #issues { border-right: 1px solid var(--line); }
  aside { border-left: 1px solid var(--line); }
  .muted { color: var(--muted); }
  button.issue, button.path {
    display: block; width: 100%; text-align: left; margin: 0 0 8px; padding: 8px;
    border-radius: 10px; border: 1px solid var(--line); background: #121b2e; color: inherit; cursor: pointer;
  }
  button.issue.active, button.path.active { border-color: var(--accent); }
  .band { font-weight: 700; }
  .Critical { color: var(--critical); }
  .High { color: var(--high); }
  .Medium { color: var(--medium); }
  .Low { color: var(--low); }
  .card { border: 1px solid var(--line); border-radius: 10px; padding: 8px; margin: 0 0 10px; background: var(--panel); }
  .card h3, h2, h3 { margin: 10px 0 6px; }
  .card p, .step { margin: 4px 0; }
  .step { padding: 6px 8px; border-radius: 8px; background: #0d1526; }
  pre.exception {
    white-space: pre-wrap;
    background: #0d1526;
    border-radius: 8px;
    padding: 8px;
    margin: 6px 0 0;
    font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
  }
  .legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
  .swatch { display: inline-block; width: 22px; height: 0; border-top: 2px solid #d6e4ff; margin-right: 6px; vertical-align: middle; }
  .swatch.inferred { border-top-style: dashed; }
  .filters { display: flex; gap: 6px; margin: 8px 0; }
  .filters button { background: transparent; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 3px 8px; cursor: pointer; }
  .filters button.active { color: var(--accent); border-color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1 id="title">Attack graph</h1>
  <input id="search" type="search" placeholder="Find a component" />
  <select id="paths"></select>
  <span class="legend"><span><i class="swatch"></i>EXTRACTED</span><span><i class="swatch inferred"></i>INFERRED</span></span>
  <span id="langs" class="muted"></span>
  <a href="report.html">Ranked paths</a>
  <a href="threat-model.html">Threat model</a>
</header>
<main>
  <section id="issues"></section>
  <canvas id="view"></canvas>
  <aside id="detail"><p class="muted">Select an issue. The graph shows the path an attacker can take. Connected findings are drawn on the same walk. The panel gives the diagnosis and the next step.</p></aside>
</main>
<script id="data" type="application/json">__PAYLOAD__</script>
<script>
const data = JSON.parse(document.getElementById("data").textContent);
const kindColor = {
  endpoint: "#7dd3fc",
  function: "#c4b5fd",
  secret: "#fb7185",
  datastore: "#4ade80",
  bucket: "#facc15",
  workflow: "#fb923c",
  cloud: "#67e8f9",
  trigger: "#fdba74",
  container: "#93c5fd",
  workload: "#86efac"
};
const nodes = data.graph.nodes.map((node, index) => ({
  ...node,
  x: 520 + Math.cos(index) * 240 + (index % 7) * 8,
  y: 340 + Math.sin(index * 1.7) * 190 + (index % 5) * 6,
  vx: 0,
  vy: 0,
  pinned: false
}));
const byId = Object.fromEntries(nodes.map((node) => [node.id, node]));
const edges = data.graph.edges.filter((edge) => byId[edge.source] && byId[edge.target]);
const canvas = document.getElementById("view");
const ctx = canvas.getContext("2d");
const camera = { x: 0, y: 0, k: 1 };
let selected = null;
let activePath = null;
let query = "";
let bandFilter = "All";
let dragging = null;
let moved = 0;

document.getElementById("title").textContent = data.repository + " attack graph";
const langNote = document.getElementById("langs");
if ((data.languages || []).length) langNote.textContent = data.languages.join(" · ");
const pathSelect = document.getElementById("paths");
function refillSelect() {
  pathSelect.textContent = "";
  const all = document.createElement("option");
  all.value = "";
  all.textContent = "All components";
  pathSelect.appendChild(all);
  data.paths.forEach((path, index) => {
    const option = document.createElement("option");
    option.value = String(index);
    option.textContent = path.band + " " + path.score + " · " + String(path.category || "").replace(/_/g, " ");
    pathSelect.appendChild(option);
  });
}
refillSelect();
pathSelect.addEventListener("change", () => {
  if (pathSelect.value === "") {
    activePath = null;
    gridAll();
    draw();
    return;
  }
  showIssue(data.paths[Number(pathSelect.value)]);
});
document.getElementById("search").addEventListener("input", (event) => {
  query = event.target.value.trim().toLowerCase();
  const hit = nodes.find((node) => node.name.toLowerCase().includes(query));
  if (hit && query) {
    const extra = [];
    edges.forEach((edge) => {
      if (edge.source === hit.id && extra.length < 12) extra.push(edge.target);
      if (edge.target === hit.id && extra.length < 12) extra.push(edge.source);
    });
    place([hit.id], extra);
    select(hit);
  } else draw();
});

const issueRoot = document.getElementById("issues");
function drawIssues() {
  issueRoot.textContent = "";
  const filters = document.createElement("div");
  filters.className = "filters";
  ["All", "Critical", "High", "Other"].forEach((label) => {
    const button = document.createElement("button");
    button.type = "button";
    button.textContent = label;
    button.className = label === bandFilter ? "active" : "";
    button.addEventListener("click", () => { bandFilter = label; drawIssues(); });
    filters.appendChild(button);
  });
  issueRoot.appendChild(filters);
  const visible = data.paths.filter((path) => {
    if (bandFilter === "All") return true;
    if (bandFilter === "Other") return path.band !== "Critical" && path.band !== "High";
    return path.band === bandFilter;
  });
  add(issueRoot, "h2", "Issues (" + visible.length + ")");
  add(issueRoot, "p", "Every composed path, plus the smaller findings the stories do not already name.").className = "muted";
  visible.forEach((path) => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "issue" + (activePath && activePath.id === path.id ? " active" : "");
    const place = (path.hops && path.hops[0] && path.hops[0].file) ? path.hops[0].file : "";
    button.textContent = path.band + " " + path.score + " · " + String(path.category || "").replace(/_/g, " ") + (place ? " · " + place : "");
    button.addEventListener("click", () => showIssue(path));
    issueRoot.appendChild(button);
  });
}

function resize() {
  const rect = canvas.parentElement.getBoundingClientRect();
  canvas.width = Math.max(rect.width, 320);
  canvas.height = Math.max(rect.height, 320);
}
window.addEventListener("resize", () => { resize(); draw(); });
resize();

function layoutPath(path) {
  const trunk = [];
  (path.node_ids || []).forEach((id) => { if (byId[id] && !trunk.includes(id)) trunk.push(id); });
  (path.hops || []).forEach((hop) => { if (hop.node_id && byId[hop.node_id] && !trunk.includes(hop.node_id)) trunk.push(hop.node_id); });
  const extra = [];
  function addExtra(id) {
    if (byId[id] && !trunk.includes(id) && !extra.includes(id) && extra.length < 18) extra.push(id);
  }
  edges.forEach((edge) => {
    if (!trunk.includes(edge.source) && !trunk.includes(edge.target)) return;
    addExtra(edge.source);
    addExtra(edge.target);
  });
  (data.paths || []).forEach((other) => {
    if (!other || other === path) return;
    const shares = (other.node_ids || []).some((id) => trunk.includes(id));
    if (!shares) return;
    (other.node_ids || []).forEach(addExtra);
  });
  place(trunk, extra);
}

function place(trunk, extra) {
  const width = canvas.width || 800;
  const height = canvas.height || 600;
  if (!trunk.length) {
    gridAll();
    return;
  }
  const visible = new Set(trunk.concat(extra));
  nodes.forEach((node) => { node.shown = visible.has(node.id); node.pinned = trunk.includes(node.id); });
  const gap = Math.max(150, (width - 160) / Math.max(trunk.length - 1, 1));
  trunk.forEach((id, index) => {
    const node = byId[id];
    node.x = trunk.length === 1 ? width / 2 : 80 + index * gap;
    node.y = height * 0.36;
  });
  extra.forEach((id, index) => {
    const node = byId[id];
    let anchor = trunk[0];
    edges.some((edge) => {
      if (edge.source === id && trunk.includes(edge.target)) { anchor = edge.target; return true; }
      if (edge.target === id && trunk.includes(edge.source)) { anchor = edge.source; return true; }
      return false;
    });
    const host = byId[anchor];
    node.x = host.x + ((index % 3) - 1) * 28;
    node.y = host.y + 120 + Math.floor(index / 3) * 64;
  });
}

function gridAll() {
  const interesting = nodes.filter((node) => (node.findings || []).length || node.risk >= 40 || node.degree > 0);
  const shown = (interesting.length ? interesting : nodes).slice(0, 80);
  const ids = new Set(shown.map((node) => node.id));
  nodes.forEach((node) => { node.shown = ids.has(node.id); node.pinned = false; });
  const cols = Math.max(1, Math.ceil(Math.sqrt(shown.length || 1)));
  shown.forEach((node, index) => {
    node.x = 80 + (index % cols) * 130;
    node.y = 70 + Math.floor(index / cols) * 76;
  });
}

function world(x, y) {
  return { x: (x - camera.x) / camera.k, y: (y - camera.y) / camera.k };
}

function draw() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = "#08101e";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.save();
  ctx.translate(camera.x, camera.y);
  ctx.scale(camera.k, camera.k);
  ctx.strokeStyle = "rgba(125, 211, 252, 0.05)";
  ctx.lineWidth = 1;
  for (let x = 0; x < canvas.width; x += 48) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
  }
  for (let y = 0; y < canvas.height; y += 48) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
  }
  const focus = new Set(activePath ? (activePath.node_ids || []) : []);
  (activePath ? activePath.hops || [] : []).forEach((hop) => { if (hop.node_id) focus.add(hop.node_id); });
  edges.forEach((edge) => {
    const a = byId[edge.source];
    const b = byId[edge.target];
    if (!a || !b || a.shown === false || b.shown === false) return;
    const hot = activePath && (activePath.edges || []).some((item) => item.source === edge.source && item.target === edge.target && item.kind === edge.relation);
    drawArrow(a, b, hot, edge.confidence === "INFERRED", false);
  });
  nodes.forEach((node) => {
    if (node.shown === false) return;
    const dim = false;
    const match = query && node.name.toLowerCase().includes(query);
    const radius = node.id === (selected && selected.id) ? 11 : (node.risk >= 70 ? 8 : 6);
    ctx.beginPath();
    ctx.arc(node.x, node.y, radius, 0, Math.PI * 2);
    ctx.fillStyle = kindColor[node.kind] || "#94a3b8";
    ctx.globalAlpha = dim ? 0.18 : 1;
    ctx.fill();
    if (node.risk >= 70) {
      ctx.strokeStyle = node.risk >= 85 ? "#fb7185" : "#fb923c";
      ctx.lineWidth = 2;
      ctx.stroke();
    }
    if (match || node.degree >= 3 || node.id === (selected && selected.id) || focus.has(node.id)) {
      const order = pathOrder(node.id);
      const label = (order ? order + "  " : "") + node.name;
      ctx.font = "12px Segoe UI, sans-serif";
      ctx.fillStyle = "#e7eefc";
      ctx.fillText(label, node.x + 12, node.y - 10);
    }
  });
  ctx.restore();
  ctx.globalAlpha = 1;
  ctx.fillStyle = "#93a0b8";
  ctx.font = "12px Segoe UI, sans-serif";
  ctx.fillText("The top row is the path an attacker can take. Connected findings sit below it.", 16, canvas.height - 16);
}

function pathOrder(id) {
  if (!activePath) return "";
  const ids = [];
  (activePath.node_ids || []).forEach((nodeId) => { if (!ids.includes(nodeId)) ids.push(nodeId); });
  const index = ids.indexOf(id);
  return index >= 0 ? String(index + 1) : "";
}

function drawArrow(a, b, hot, inferred, dim) {
  const dx = b.x - a.x;
  const dy = b.y - a.y;
  const dist = Math.hypot(dx, dy) || 1;
  const pad = 12;
  const x2 = b.x - dx / dist * pad;
  const y2 = b.y - dy / dist * pad;
  ctx.beginPath();
  ctx.moveTo(a.x, a.y);
  ctx.lineTo(x2, y2);
  ctx.strokeStyle = hot ? "#f8fafc" : (inferred ? "#64748b" : "#94a3b8");
  ctx.globalAlpha = dim ? 0.12 : 0.9;
  ctx.lineWidth = hot ? 2.6 : 1;
  ctx.setLineDash(inferred ? [5, 4] : []);
  ctx.stroke();
  ctx.setLineDash([]);
  const angle = Math.atan2(dy, dx);
  ctx.beginPath();
  ctx.moveTo(x2, y2);
  ctx.lineTo(x2 - 8 * Math.cos(angle - 0.4), y2 - 8 * Math.sin(angle - 0.4));
  ctx.lineTo(x2 - 8 * Math.cos(angle + 0.4), y2 - 8 * Math.sin(angle + 0.4));
  ctx.closePath();
  ctx.fillStyle = ctx.strokeStyle;
  ctx.fill();
}

canvas.addEventListener("wheel", (event) => {
  event.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const mx = event.clientX - rect.left;
  const my = event.clientY - rect.top;
  const before = world(mx, my);
  camera.k = Math.min(2.8, Math.max(0.35, camera.k * (event.deltaY < 0 ? 1.08 : 0.92)));
  camera.x = mx - before.x * camera.k;
  camera.y = my - before.y * camera.k;
  draw();
}, { passive: false });

canvas.addEventListener("pointerdown", (event) => {
  const point = eventPoint(event);
  const hit = hitNode(point.x, point.y);
  moved = 0;
  dragging = { x: event.clientX, y: event.clientY, node: hit, cx: camera.x, cy: camera.y };
});
canvas.addEventListener("pointermove", (event) => {
  if (!dragging) return;
  moved += Math.abs(event.clientX - dragging.x) + Math.abs(event.clientY - dragging.y);
  if (dragging.node) {
    const point = eventPoint(event);
    dragging.node.x = point.x;
    dragging.node.y = point.y;
    dragging.node.pinned = true;
  } else {
    camera.x = dragging.cx + (event.clientX - dragging.x);
    camera.y = dragging.cy + (event.clientY - dragging.y);
  }
  draw();
});
canvas.addEventListener("pointerup", (event) => {
  if (dragging && moved < 5) {
    const point = eventPoint(event);
    const hit = hitNode(point.x, point.y);
    if (hit) select(hit);
  }
  dragging = null;
});

function eventPoint(event) {
  const rect = canvas.getBoundingClientRect();
  return world(event.clientX - rect.left, event.clientY - rect.top);
}
function hitNode(x, y) {
  let best = null;
  let bestDist = 16;
  nodes.forEach((node) => {
    const dist = Math.hypot(node.x - x, node.y - y);
    if (dist < bestDist) { best = node; bestDist = dist; }
  });
  return best;
}

function showIssue(path) {
  activePath = path;
  const index = data.paths.indexOf(path);
  if (index >= 0) pathSelect.value = String(index);
  layoutPath(path);
  const detail = document.getElementById("detail");
  detail.textContent = "";
  detail.appendChild(pathCard(path, false, new Set()));
  drawIssues();
  draw();
}

function select(node) {
  selected = node;
  const outgoing = edges.filter((edge) => edge.source === node.id);
  const incoming = edges.filter((edge) => edge.target === node.id);
  const detail = document.getElementById("detail");
  const seen = new Set();
  detail.textContent = "";
  add(detail, "h2", node.name);
  const meta = [
    "Source: " + (node.file || "resolved") + (node.line ? ":" + node.line : ""),
    "Language: " + (node.language || "resolved"),
    "Kind: " + node.kind,
    "Community: " + node.community_label,
    "Degree: " + node.degree
  ];
  add(detail, "p", meta.join("\n")).style.whiteSpace = "pre-wrap";
  const related = data.paths.filter((path) => (path.node_ids || []).includes(node.id) || (path.hops || []).some((hop) => hop.node_id === node.id));
  add(detail, "h3", "Paths to eliminate (" + related.length + ")");
  if (!related.length) add(detail, "p", "This component is not on an elimination path in this snapshot.").className = "muted";
  related.forEach((path) => detail.appendChild(pathCard(path, true, seen)));
  if ((node.findings || []).length) {
    add(detail, "h3", "On this component");
    node.findings.forEach((finding) => detail.appendChild(findingBlock(finding, seen)));
  }
  const links = outgoing.concat(incoming).filter((edge) => !seen.has(edgeKey(edge)));
  if (links.length) {
    add(detail, "h3", "Connections (" + links.length + ")");
    links.forEach((edge) => {
      const arrow = edge.source === node.id ? "→ " + nameOf(edge.target) : "← " + nameOf(edge.source);
      add(detail, "p", arrow + " [" + edge.relation + "] [" + edge.confidence + "]" + evidenceSuffix(edge, seen));
    });
  }
  draw();
}

function pathCard(path, highlight, seen) {
  const card = document.createElement("article");
  card.className = "card";
  const title = document.createElement("h3");
  const band = document.createElement("span");
  band.className = "band " + path.band;
  band.textContent = path.band + " " + path.score;
  title.appendChild(band);
  title.appendChild(document.createTextNode(" · " + String(path.category || "").replace(/_/g, " ")));
  card.appendChild(title);
  const diagnosis = diagnosisText(path);
  if (!already(seen, diagnosis)) {
    add(card, "h3", "Diagnosis");
    add(card, "p", diagnosis);
  }
  if (path.explanation && !already(seen, path.explanation)) {
    add(card, "p", path.explanation);
    remember(seen, path.explanation);
  }
  const links = (path.connected_paths || []).filter((link) => link && link.category);
  if (links.length) {
    add(card, "h3", "Connected attack paths");
    links.forEach((link) => {
      add(card, "p", link.band + " " + link.score + " · " + String(link.category).replace(/_/g, " "));
    });
  }
  remember(seen, diagnosis);
  const places = new Set();
  const hopRows = [];
  (path.hops || []).forEach((hop) => {
    const place = hop.file ? hop.file + (hop.line ? ":" + hop.line : "") : "";
    if (place) places.add(place);
    const evidence = hop.evidence && !containsText(diagnosis, hop.evidence) ? hop.evidence : "";
    const parts = [hop.label, hop.rule, place, evidence].filter((part) => part && !containsText(diagnosis, part)).join(" · ");
    if (parts && !already(seen, parts) && !hopRows.some((row) => row.parts === parts)) hopRows.push({ hop, parts });
    remember(seen, parts);
    remember(seen, hop.evidence);
  });
  if (hopRows.length) add(card, "h3", "Clear path");
  hopRows.forEach((row, index) => {
    const line = document.createElement("p");
    line.className = "step";
    line.textContent = (index + 1) + ". " + row.parts;
    if (row.hop.node_id && byId[row.hop.node_id]) {
      line.style.cursor = "pointer";
      line.addEventListener("click", () => select(byId[row.hop.node_id]));
    }
    card.appendChild(line);
  });
  const freshEdges = (path.edges || []).filter((edge) => !seen.has(edgeKey(edge)));
  if (freshEdges.length) {
    add(card, "p", "How the walk is reachable");
    freshEdges.forEach((edge) => {
      const suffix = evidenceSuffix(edge, seen);
      remember(seen, edgeKey(edge));
      remember(seen, edge.evidence);
      add(card, "p", nameOf(edge.source) + " --" + edge.kind + "--> " + nameOf(edge.target) + " [" + edge.confidence + "]" + suffix);
    });
  }
  (path.edges || []).forEach((edge) => remember(seen, edgeKey(edge)));
  const actions = uniqueActions(path.next_steps || []).filter((step) => !alreadyAction(seen, step.action));
  if (actions.length) {
    add(card, "h3", "Next step");
    actions.forEach((step) => {
      const place = step.file ? step.file + (step.line ? ":" + step.line : "") : "";
      const suffix = place && !places.has(place) ? " · " + place : "";
      const row = document.createElement("p");
      row.className = "step";
      row.textContent = step.order + ". " + step.action + suffix;
      card.appendChild(row);
      remember(seen, step.action);
    });
  }
  const extraRemove = (path.remove || []).filter((text) => !alreadyAction(seen, text) && !actions.some((step) => sameAction(step.action, text)));
  if (extraRemove.length) {
    add(card, "h3", "What to remove");
    extraRemove.forEach((text) => {
      add(card, "p", text);
      remember(seen, text);
    });
  }
  if (highlight) {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "path" + (activePath && activePath.id === path.id ? " active" : "");
    button.textContent = "Show this path on the graph";
    button.addEventListener("click", () => showIssue(path));
    card.appendChild(button);
  }
  return card;
}

function findingBlock(finding, seen) {
  const card = document.createElement("article");
  card.className = "card";
  const title = document.createElement("h3");
  const scoreLead = (finding.band ? finding.band + " " + (finding.score ?? "") : "").trim();
  title.textContent = (scoreLead ? scoreLead + " · " : "") + (finding.title || finding.rule || "Finding");
  title.style.cursor = "pointer";
  const body = document.createElement("div");
  body.hidden = true;
  const access = finding.access || "An attacker can use this finding on its own. Access stays on this component and does not depend on another file.";
  if (!already(seen, access)) add(body, "p", access);
  if (finding.foothold && !already(seen, finding.foothold)) add(body, "p", "Foothold: " + finding.foothold);
  if (finding.connected && !already(seen, finding.connected)) add(body, "p", "Connected attack paths: " + finding.connected);
  let why = finding.why || "This scan confirmed the file and line.";
  if (scoreLead && why.startsWith(scoreLead)) why = why.slice(scoreLead.length).replace(/^[.\s]+/, "");
  if (why && !already(seen, why)) add(body, "p", "Why this is first: " + why);
  if (finding.effect && !already(seen, finding.effect)) add(body, "p", finding.effect);
  if (finding.database && !already(seen, finding.database)) add(body, "p", "Database: " + finding.database);
  if (finding.recommendation && !already(seen, finding.recommendation)) add(body, "p", "Next step: " + finding.recommendation);
  if (finding.dread_text) add(body, "p", finding.dread_text);
  if ((finding.stride || []).length) add(body, "p", "STRIDE · " + finding.stride.join(", "));
  if (finding.pasta) add(body, "p", "PASTA · " + finding.pasta);
  if (finding.fingerprint) add(body, "p", "Exception id: " + finding.fingerprint);
  const walk = (finding.walk || []).filter((step) => !already(seen, step) && !sameFinding(step, finding) && !repeatsHop(seen, step));
  if (walk.length) {
    add(body, "p", "Walk");
    walk.forEach((step) => add(body, "p", step));
  }
  const link = document.createElement("a");
  link.href = "threat-model.html#" + encodeURIComponent([finding.rule || "", finding.file || "", String(finding.line || "")].join("|"));
  link.textContent = "Open this issue in the threat model";
  const row = document.createElement("p");
  row.appendChild(link);
  body.appendChild(row);
  add(body, "p", "For the exception record");
  add(body, "p", "One issue in pathfinder-exceptions.yml. A reason needs at least 8 characters. A blank reason does not hide this finding.").className = "muted";
  const line = finding.line === 0 || finding.line ? String(finding.line) : '""';
  const snippet = document.createElement("pre");
  snippet.className = "exception";
  snippet.textContent = "exceptions:\n  - file: " + (finding.file || "") + "\n    rule: " + (finding.rule || "") + "\n    line: " + line + "\n    reason:";
  body.appendChild(snippet);
  if (finding.evidence) {
    add(body, "p", "Or on the line above the evidence:").className = "muted";
    const inline = document.createElement("pre");
    inline.className = "exception";
    inline.textContent = "# pathfinder: false-positive: \n" + String(finding.evidence).split("\n")[0];
    body.appendChild(inline);
  }
  title.addEventListener("click", () => { body.hidden = !body.hidden; });
  card.appendChild(title);
  card.appendChild(body);
  return card;
}

function diagnosisText(path) {
  let text = String(path.diagnosis || path.narrative || "");
  const start = text.indexOf(" The clear path starts at ");
  if (start > 0) text = text.slice(0, start);
  const recorded = text.indexOf(" Recorded at ");
  if (recorded > 0) text = text.slice(0, recorded);
  return text.trim();
}
function edgeKey(edge) {
  return nameOf(edge.source) + "|" + (edge.relation || edge.kind || "") + "|" + nameOf(edge.target);
}
function remember(seen, text) {
  const value = String(text || "").replace(/\s+/g, " ").trim();
  if (value) seen.add(value);
}
function containsText(haystack, needle) {
  const value = String(needle || "").replace(/\s+/g, " ").trim();
  return value.length >= 12 && String(haystack || "").includes(value);
}
function already(seen, text) {
  const value = String(text || "").replace(/\s+/g, " ").trim();
  if (!value || !seen) return false;
  if (seen.has(value)) return true;
  for (const item of seen) {
    if (item.length < 24 || value.length < 24) continue;
    const shorter = Math.min(item.length, value.length);
    const longer = Math.max(item.length, value.length);
    if (shorter / longer < 0.72) continue;
    if (item.includes(value) || value.includes(item)) return true;
  }
  return false;
}
function alreadyAction(seen, text) {
  if (!seen) return false;
  for (const item of seen) {
    if (sameAction(item, text)) return true;
  }
  return false;
}
function uniqueActions(steps) {
  const kept = [];
  steps.forEach((step) => {
    const match = kept.find((other) => sameAction(step.action, other.action));
    if (!match) kept.push(step);
    else if (actionKey(step.action).length > actionKey(match.action).length) kept[kept.indexOf(match)] = step;
  });
  return kept.map((step, index) => Object.assign({}, step, { order: index + 1 }));
}
function sameAction(left, right) {
  const a = actionKey(left);
  const b = actionKey(right);
  if (!a || !b) return false;
  return a === b || a.includes(b) || b.includes(a);
}
function actionKey(text) {
  return String(text || "").toLowerCase().replace(/^deletion:\s*/, "").replace(/\b(delete|remove)\b/g, "remove").replace(/[.]/g, "").replace(/\s+/g, " ").trim();
}
function repeatsHop(seen, step) {
  const text = String(step || "");
  if (!seen) return false;
  for (const item of seen) {
    if (item.length >= 16 && text.includes(item)) return true;
  }
  return false;
}
function sameFinding(step, finding) {
  const text = String(step || "");
  const file = finding.file || "";
  const rule = finding.rule || "";
  const evidence = String(finding.evidence || "").split("\n")[0];
  return (!file || text.includes(file)) && (!rule || text.includes(rule)) && (!evidence || text.includes(evidence));
}

function evidenceSuffix(edge, seen) {
  const evidence = edge.evidence && !mentioned(seen, edge.evidence) ? " " + edge.evidence : "";
  const place = edge.file ? edge.file + (edge.line ? ":" + edge.line : "") : "";
  const located = place && !mentioned(seen, place) ? " " + place : "";
  return evidence + located;
}
function mentioned(seen, text) {
  const value = String(text || "").trim();
  if (!value || value.length < 8 || !seen) return false;
  if (seen.has(value)) return true;
  for (const item of seen) {
    if (item.includes(value)) return true;
  }
  return false;
}
function nameOf(id) { return byId[id] ? byId[id].name : id; }
function add(parent, tag, text) {
  const el = document.createElement(tag);
  el.textContent = text;
  parent.appendChild(el);
  return el;
}
drawIssues();
if (data.paths.length) showIssue(data.paths[0]);
else { gridAll(); draw(); }
</script>
