<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Threat model</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0c1222;
    --panel: #141c2f;
    --line: #27344d;
    --text: #e7eefc;
    --muted: #93a0b8;
    --accent: #7dd3fc;
    --critical: #fb7185;
    --high: #fb923c;
    --medium: #facc15;
    --low: #4ade80;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--text); }
  header, main { padding: 20px 24px; }
  header { border-bottom: 1px solid var(--line); }
  h1 { margin: 0 0 6px; font-size: 22px; }
  h2 { margin: 0 0 8px; font-size: 18px; }
  a { color: var(--accent); }
  .muted { color: var(--muted); }
  .lenses, .groups { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  button.lens, button.group, button.quiet {
    background: #10192d;
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 6px 12px;
    cursor: pointer;
  }
  button.lens.active, button.group.active { border-color: var(--accent); color: var(--accent); }
  button.quiet { border-radius: 8px; color: var(--muted); }
  #panel { margin-top: 18px; }
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px;
    margin: 0 0 10px;
  }
  .card h3 { margin: 0 0 8px; font-size: 16px; cursor: pointer; }
  .card p { margin: 4px 0; }
  .Critical { color: var(--critical); }
  .High { color: var(--high); }
  .Medium { color: var(--medium); }
  .Low { color: var(--low); }
  .detail { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); }
  ul { margin: 6px 0; padding-left: 18px; }
  .triage { display: grid; grid-template-columns: 72px 1fr; gap: 4px 8px; margin: 8px 0; }
  .triage dt { color: var(--muted); }
  .triage dd { margin: 0; font-family: ui-monospace, "Cascadia Code", Consolas, monospace; word-break: break-all; }
  pre.exception {
    white-space: pre-wrap;
    background: #0c1222;
    border-radius: 8px;
    padding: 8px;
    margin: 6px 0 0;
    font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
  }
  button.copy {
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 4px 8px;
    cursor: pointer;
  }
</style>
</head>
<body>
<header>
  <h1 id="title">Threat model</h1>
  <p class="muted"><a href="report.html">Ranked paths</a> · <a href="graph.html">Graph</a></p>
  <p class="muted">Threats to eliminate. Choose a lens, then a group. The page shows only that group.</p>
  <div class="lenses" id="lenses"></div>
  <div class="groups" id="groups"></div>
</header>
<main>
  <div id="panel"><p class="muted">Select a group. Critical, for example, lists only the critical findings: why each one is first, the effect, and the next change.</p></div>
</main>
<script id="data" type="application/json">__PAYLOAD__</script>
<script>
const model = JSON.parse(document.getElementById("data").textContent);
document.getElementById("title").textContent = model.repository + " threat model";

const LENSES = [
  { id: "severity", name: "Severity", order: ["Critical", "High", "Medium", "Low", "Unscored"] },
  { id: "reachability", name: "Reachability", order: ["Reachable from an entry", "Connected walk", "Local signal"] },
  { id: "exploitability", name: "Exploitability", order: ["High", "Moderate", "Lower", "Not scored"] },
  { id: "stride", name: "STRIDE", order: ["Spoofing", "Tampering", "Repudiation", "Information disclosure", "Denial of service", "Elevation of privilege", "Not classified"], multi: true },
  { id: "dread", name: "DREAD", order: ["Damage", "Reproducibility", "Exploitability", "Affected users", "Discoverability", "Not scored"], multi: true },
  { id: "pasta", name: "PASTA", order: ["Stage 4 · Threat analysis", "Stage 5 · Weakness analysis", "Stage 6 · Attack modeling", "Stage 7 · Risk and impact"] }
];

let lens = LENSES[0];
let group = "";
let openId = "";

function valuesOf(threat) {
  if (lens.id === "severity") return [threat.severity || "Unscored"];
  if (lens.id === "reachability") return [threat.reachability || "Local signal"];
  if (lens.id === "exploitability") return [threat.exploitability_level || "Not scored"];
  if (lens.id === "stride") return threat.stride && threat.stride.length ? threat.stride : ["Not classified"];
  if (lens.id === "dread") return threat.dread_groups && threat.dread_groups.length ? threat.dread_groups : ["Not scored"];
  return [threat.pasta || "Stage 7 · Risk and impact"];
}

function members(label) {
  return model.threats.filter((threat) => valuesOf(threat).includes(label));
}

function drawLenses() {
  const root = document.getElementById("lenses");
  root.textContent = "";
  LENSES.forEach((item) => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "lens" + (item.id === lens.id ? " active" : "");
    button.textContent = item.name;
    button.addEventListener("click", () => {
      lens = item;
      group = "";
      openId = "";
      drawLenses();
      drawGroups();
      drawPanel();
    });
    root.appendChild(button);
  });
  const scope = document.createElement("button");
  scope.type = "button";
  scope.className = "quiet";
  scope.textContent = "Scope";
  scope.addEventListener("click", () => { group = "__scope"; openId = ""; drawGroups(); drawPanel(); });
  root.appendChild(scope);
  const notes = document.createElement("button");
  notes.type = "button";
  notes.className = "quiet";
  notes.textContent = "Review notes";
  notes.addEventListener("click", () => { group = "__notes"; openId = ""; drawGroups(); drawPanel(); });
  root.appendChild(notes);
  if ((model.suppressed || []).length) {
    const exceptions = document.createElement("button");
    exceptions.type = "button";
    exceptions.className = "quiet";
    exceptions.textContent = "Exceptions (" + model.suppressed.length + ")";
    exceptions.addEventListener("click", () => { group = "__exceptions"; openId = ""; drawGroups(); drawPanel(); });
    root.appendChild(exceptions);
  }
}

function drawGroups() {
  const root = document.getElementById("groups");
  root.textContent = "";
  if (group === "__scope" || group === "__notes" || group === "__exceptions") return;
  const present = new Map();
  model.threats.forEach((threat) => {
    valuesOf(threat).forEach((label) => present.set(label, (present.get(label) || 0) + 1));
  });
  const labels = lens.order.filter((label) => present.has(label));
  present.forEach((_count, label) => { if (!labels.includes(label)) labels.push(label); });
  labels.forEach((label) => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "group" + (label === group ? " active" : "");
    button.textContent = label + " (" + present.get(label) + ")";
    button.addEventListener("click", () => {
      group = label;
      openId = "";
      drawGroups();
      drawPanel();
    });
    root.appendChild(button);
  });
}

function drawPanel() {
  const root = document.getElementById("panel");
  root.textContent = "";
  if (group === "__scope") return drawScope(root);
  if (group === "__notes") return drawNotes(root);
  if (group === "__exceptions") return drawExceptions(root);
  if (!group) {
    add(root, "p", "Select a group. A click lists only those findings, with why each is prioritized, the effect, and the next change.").className = "muted";
    return;
  }
  const items = members(group).sort((a, b) => b.score - a.score || a.name.localeCompare(b.name));
  add(root, "h2", group + " · " + items.length);
  const reachable = items.filter((item) => item.reachability !== "Local signal").length;
  const high = items.filter((item) => item.exploitability_level === "High").length;
  add(root, "p", groupReason(items.length, reachable, high)).className = "muted";
  items.forEach((threat, index) => root.appendChild(card(threat, index)));
}

function groupReason(count, reachable, high) {
  const noun = count === 1 ? "finding" : "findings";
  return count + " " + noun + " in " + lens.name + ". " + reachable + " are reachable walks. " + high + " have high exploitability. The rows below are only this group.";
}

function card(threat, index) {
  const id = String(index) + "|" + threat.name + "|" + threat.score;
  const el = document.createElement("article");
  el.className = "card";
  const title = document.createElement("h3");
  const band = document.createElement("span");
  band.className = threat.band || "";
  band.textContent = (threat.band || "Unscored") + " " + threat.score;
  title.appendChild(band);
  title.appendChild(document.createTextNode(" · " + threat.name));
  title.addEventListener("click", () => {
    openId = openId === id ? "" : id;
    drawPanel();
  });
  el.appendChild(title);
  add(el, "p", "Why this is first: " + (threat.why || ""));
  add(el, "p", threat.effect || "");
  if (threat.recommendation) add(el, "p", "Next step: " + threat.recommendation);
  if (openId === id) {
    el.id = "open-threat";
    el.appendChild(detail(threat));
  }
  return el;
}

function detail(threat) {
  const box = document.createElement("div");
  box.className = "detail";
  add(box, "p", threat.narrative || "");
  const dread = threat.dread || {};
  add(box, "p", "DREAD · damage " + show(dread.asset) + " · reproducibility " + (threat.reachability === "Local signal" ? "local" : "walk is in the files") + " · exploitability " + show(dread.exploitability) + " · affected users " + show(dread.exposure) + " · discoverability " + (threat.reachability === "Reachable from an entry" ? "entry is exposed" : "not an exposed entry"));
  if ((threat.stride || []).length) add(box, "p", "STRIDE · " + threat.stride.join(", "));
  if (threat.pasta) add(box, "p", "PASTA · " + threat.pasta);
  const marked = (threat.hops || []).find((hop) => hop.fingerprint);
  if (marked) add(box, "p", "Exception id: " + marked.fingerprint + " · " + (marked.file || "") + (marked.line ? ":" + marked.line : ""));
  if ((threat.hops || []).length) {
    add(box, "p", "Walk");
    const list = document.createElement("ul");
    threat.hops.forEach((hop) => {
      const li = document.createElement("li");
      const place = hop.file ? hop.file + (hop.line ? ":" + hop.line : "") : "";
      li.textContent = [hop.label, hop.rule, place, hop.evidence].filter(Boolean).join(" · ");
      list.appendChild(li);
    });
    box.appendChild(list);
    threat.hops.forEach((hop) => {
      if (hop.rule && hop.file) box.appendChild(exceptionRecord(hop));
    });
  }
  if ((threat.remove || []).length > 1) {
    add(box, "p", "What to remove");
    const list = document.createElement("ul");
    threat.remove.forEach((text) => {
      const li = document.createElement("li");
      li.textContent = text;
      list.appendChild(li);
    });
    box.appendChild(list);
  }
  return box;
}

function drawScope(root) {
  add(root, "h2", "Scope");
  add(root, "p", "Trust boundaries and assets in this snapshot.").className = "muted";
  model.boundaries.forEach((item) => add(root, "p", item.name + " · " + item.count + " components"));
  model.assets.forEach((asset) => {
    const place = asset.file ? asset.file + (asset.line ? ":" + asset.line : "") : asset.kind;
    add(root, "p", asset.name + " · " + asset.kind + " · " + place);
  });
}

function drawExceptions(root) {
  add(root, "h2", "Exceptions");
  add(root, "p", "These cases were marked false positives by the remediation team. They are not in the severity, STRIDE, DREAD, or PASTA groups.").className = "muted";
  (model.suppressed || []).forEach((item) => {
    const card = document.createElement("article");
    card.className = "card";
    const place = item.file ? item.file + (item.line ? ":" + item.line : "") : "";
    add(card, "p", [item.rule, item.title, place].filter(Boolean).join(" · "));
    add(card, "p", "Reason: " + (item.reason || ""));
    add(card, "p", "Marked by " + (item.by || "remediation") + (item.fingerprint ? " · " + item.fingerprint : ""));
    root.appendChild(card);
  });
}

function drawNotes(root) {
  add(root, "h2", "Review notes");
  const seen = new Set();
  (model.notes || []).forEach((note) => {
    const key = note.framework + "|" + note.detail;
    if (seen.has(key)) return;
    seen.add(key);
    const card = document.createElement("article");
    card.className = "card";
    add(card, "p", note.framework || "Review");
    add(card, "p", note.detail);
    root.appendChild(card);
  });
  if (!root.querySelector(".card")) add(root, "p", "No extra review note in this snapshot.").className = "muted";
}

function placeKey(hop) {
  return [hop.rule || "", hop.file || "", String(hop.line || "")].join("|");
}

function yamlScalar(value) {
  const text = String(value ?? "");
  if (text === "") return '""';
  if (/[:#{}[\],&*!|>'"%@`]|^\s|\s$|\n/.test(text)) {
    return '"' + text.replace(/\\/g, "\\\\").replace(/"/g, '\\"') + '"';
  }
  return text;
}

function exceptionYaml(hop) {
  const line = hop.line === 0 || hop.line ? String(hop.line) : "";
  return [
    "exceptions:",
    "  - file: " + yamlScalar(hop.file || ""),
    "    rule: " + yamlScalar(hop.rule || ""),
    "    line: " + (line || '""'),
    "    reason:"
  ].join("\n");
}

function exceptionRecord(hop) {
  const block = document.createElement("div");
  const list = document.createElement("dl");
  list.className = "triage";
  [["File", hop.file], ["Rule", hop.rule], ["Line", hop.line || "not recorded"]].forEach(([label, value]) => {
    const term = document.createElement("dt");
    term.textContent = label;
    const data = document.createElement("dd");
    data.textContent = String(value);
    list.appendChild(term);
    list.appendChild(data);
  });
  block.appendChild(list);
  const record = document.createElement("p");
  record.textContent = "For the exception record";
  block.appendChild(record);
  add(block, "p", "One issue. Commit pathfinder-exceptions.yml in the repository that runs the scan, at the root next to README.md. Fill in a reason of at least 8 characters. A blank reason does not hide this finding. Another finding in the same file stays.").className = "muted";
  const snippet = document.createElement("pre");
  snippet.className = "exception";
  snippet.textContent = exceptionYaml(hop);
  block.appendChild(snippet);
  const copy = document.createElement("button");
  copy.type = "button";
  copy.className = "copy";
  copy.textContent = "Copy";
  copy.addEventListener("click", () => {
    const text = snippet.textContent;
    const done = () => {
      copy.textContent = "Copied";
      setTimeout(() => { copy.textContent = "Copy"; }, 1200);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(() => done());
    } else {
      done();
    }
  });
  block.appendChild(copy);
  if (hop.evidence) {
    add(block, "p", "Or on the line above the evidence:").className = "muted";
    const inline = document.createElement("pre");
    inline.className = "exception";
    inline.textContent = "# pathfinder: false-positive: \n" + String(hop.evidence).split("\n")[0];
    block.appendChild(inline);
  }
  return block;
}

function openLinked() {
  const raw = decodeURIComponent((location.hash || "").replace(/^#/, ""));
  if (!raw) return false;
  const threat = (model.threats || []).find((item) => (item.hops || []).some((hop) => placeKey(hop) === raw));
  if (!threat) return false;
  lens = LENSES[0];
  group = threat.severity || threat.band || "Unscored";
  const items = members(group).sort((a, b) => b.score - a.score || a.name.localeCompare(b.name));
  const index = items.indexOf(threat);
  if (index < 0) return false;
  openId = String(index) + "|" + threat.name + "|" + threat.score;
  return true;
}

function show(value) {
  if (value === undefined || value === null || value === "") return "—";
  return String(value);
}

function add(parent, tag, text) {
  const el = document.createElement(tag);
  el.textContent = text;
  parent.appendChild(el);
  return el;
}

const linked = openLinked();
drawLenses();
drawGroups();
drawPanel();
if (linked) {
  const open = document.getElementById("open-threat");
  if (open) open.scrollIntoView({ block: "start" });
}
</script>
</body>
</html>
