<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Attack path summary</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0c1222;
    --panel: #141c2f;
    --line: #27344d;
    --text: #e7eefc;
    --muted: #93a0b8;
    --accent: #7dd3fc;
    --critical: #fb7185;
    --high: #fb923c;
    --medium: #facc15;
    --low: #4ade80;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.55 "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--text); }
  header, main { padding: 20px 24px; }
  main { max-width: 980px; margin: 0 auto; }
  header { border-bottom: 1px solid var(--line); }
  h1 { margin: 0 0 8px; font-size: 26px; }
  h2 { margin: 0 0 8px; font-size: 18px; }
  a { color: var(--accent); }
  .muted { color: var(--muted); }
  .links { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
  .links a {
    display: inline-block;
    padding: 8px 12px;
    border: 1px solid var(--line);
    border-radius: 999px;
    text-decoration: none;
    background: #10192d;
  }
  .stats { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-width: 120px; }
  .stat b { display: block; font-size: 20px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin: 16px 0; }
  .panel p { margin: 0 0 10px; }
  ul { margin: 8px 0 0; padding-left: 18px; }
  li { margin: 0 0 8px; }
  .Critical { color: var(--critical); }
  .High { color: var(--high); }
  .Medium { color: var(--medium); }
  .Low { color: var(--low); }
</style>
</head>
<body>
<header>
  <h1 id="title">Attack path summary</h1>
  <p class="muted" id="subtitle"></p>
  <nav class="links">
    <a href="threat-model.html">Threat model</a>
    <a href="graph.html">Graph</a>
    <a href="unused.html">Unused code</a>
  </nav>
  <div class="stats" id="stats"></div>
</header>
<main>
  <section class="panel">
    <h2>What this application does</h2>
    <p id="about"></p>
  </section>
  <section class="panel">
    <h2>What was found</h2>
    <p id="found"></p>
    <ul id="paths"></ul>
  </section>
  <section class="panel" id="ignored" hidden>
    <h2>Generic credentials ignored</h2>
    <ul id="ignored-list"></ul>
  </section>
</main>
<script id="data" type="application/json">__PAYLOAD__</script>
<script>
const data = JSON.parse(document.getElementById("data").textContent);
const card = data.scorecard || {};
const paths = data.paths || [];
const findings = data.findings || [];
const unused = (data.unused || {}).summary || {};
document.getElementById("title").textContent = (data.repository || "Repository") + " · attack path summary";
document.getElementById("subtitle").textContent = "Open a linked page for the line, the effect, and the erasure.";

const stats = [
  ["Critical", card.critical_paths || 0],
  ["High", card.high_paths || 0],
  ["Findings", card.findings || findings.length],
  ["Unused code", unused.removals || 0],
  ["Attack path score", card.attack_path_score || 0]
];
const statsRoot = document.getElementById("stats");
stats.forEach(([label, value]) => {
  const el = document.createElement("div");
  el.className = "stat";
  const number = document.createElement("b");
  number.textContent = String(value);
  el.appendChild(number);
  el.appendChild(document.createTextNode(label));
  statsRoot.appendChild(el);
});

document.getElementById("about").textContent = whatItDoes(data);

const bands = { Critical: 0, High: 0, Medium: 0, Low: 0 };
paths.forEach((path) => { if (bands[path.band] !== undefined) bands[path.band] += 1; });
const medium = paths.filter((path) => path.band === "Medium").length;
document.getElementById("found").textContent =
  bands.Critical + " critical path(s), " + bands.High + " high path(s), and " + medium +
  " medium path(s). " + findings.length + " finding(s) stayed in this scan. " +
  (unused.removals || 0) + " unused private symbol(s) can be removed. " +
  ((data.suppressed || []).length ? (data.suppressed || []).length + " exception(s) were left out. " : "");

const list = document.getElementById("paths");
const ranked = paths.slice().sort((a, b) => (b.score || 0) - (a.score || 0));
if (!ranked.length && !findings.length) {
  const item = document.createElement("li");
  item.textContent = "No attack path stayed after validation.";
  list.appendChild(item);
}
ranked.forEach((path) => list.appendChild(pathRow(path)));
const covered = new Set();
ranked.forEach((path) => (path.hops || []).forEach((hop) => covered.add(placeKey(hop))));
findings.forEach((finding) => {
  if (covered.has(placeKey(finding))) return;
  list.appendChild(findingRow(finding));
});

const ignored = data.ignored_credentials || [];
if (ignored.length) {
  document.getElementById("ignored").hidden = false;
  const root = document.getElementById("ignored-list");
  ignored.forEach((item) => {
    const li = document.createElement("li");
    li.textContent = (item.file || "") + ":" + (item.line || "") + " " + (item.name || "credential") + ". " + (item.reason || "");
    root.appendChild(li);
  });
}

function pathRow(path) {
  const hop = (path.hops || []).find((item) => item.file) || {};
  const place = hop.file ? hop.file + (hop.line ? ":" + hop.line : "") : "";
  const li = document.createElement("li");
  const band = document.createElement("span");
  band.className = path.band || "";
  band.textContent = (path.band || "Unscored") + " " + (path.score || "");
  li.appendChild(band);
  const name = String(path.category || "path").replace(/_/g, " ");
  li.appendChild(document.createTextNode(" · " + name + (place ? " · " + place : "") + ". "));
  const link = document.createElement("a");
  link.href = "threat-model.html#" + encodeURIComponent(placeKey(hop));
  link.textContent = "Open in the threat model";
  li.appendChild(link);
  return li;
}

function findingRow(finding) {
  const place = finding.file ? finding.file + (finding.line ? ":" + finding.line : "") : "";
  const li = document.createElement("li");
  const band = document.createElement("span");
  band.className = finding.band || "";
  band.textContent = (finding.band || "Unscored") + " " + (finding.score || "");
  li.appendChild(band);
  li.appendChild(document.createTextNode(" · " + (finding.title || finding.rule || "Finding") + (place ? " · " + place : "") + ". "));
  const link = document.createElement("a");
  link.href = "threat-model.html#" + encodeURIComponent(placeKey(finding));
  link.textContent = "Open in the threat model";
  li.appendChild(link);
  return li;
}

function placeKey(hop) {
  return [hop.rule || "", hop.file || "", String(hop.line || "")].join("|");
}

function whatItDoes(snapshot) {
  const name = snapshot.repository || "This repository";
  const nodes = snapshot.nodes || [];
  const languages = [...new Set(nodes.map((node) => node.language).filter(Boolean))].sort();
  const routes = [];
  (snapshot.components || []).forEach((item) => {
    if (item.receives && !routes.includes(item.receives)) routes.push(item.receives);
  });
  nodes.forEach((node) => {
    const props = node.properties || {};
    if (node.kind === "endpoint" && props.method && props.path) {
      const route = String(props.method).toUpperCase() + " " + props.path;
      if (!routes.includes(route)) routes.push(route);
    }
  });
  const surfaces = [];
  if (nodes.some((node) => node.kind === "workflow")) surfaces.push("a pipeline");
  if (nodes.some((node) => node.kind === "container")) surfaces.push("a container image");
  if (nodes.some((node) => node.kind === "workload")) surfaces.push("a deployed workload");
  if (nodes.some((node) => node.kind === "bucket" || node.kind === "cloud")) surfaces.push("cloud resources");
  const specs = nodes.filter((node) => String(node.name || "").indexOf("OpenAPI ") === 0);
  let text = name;
  if (languages.length) text += " is written in " + joinList(languages) + ".";
  else text += " was reviewed from the files in this checkout.";
  if (routes.length) text += " It accepts " + joinList(routes.slice(0, 8)) + ".";
  else text += " No public route was named in the files that were read.";
  if (specs.length) text += " An OpenAPI document describes " + specs.length + (specs.length === 1 ? " operation." : " operations.");
  if (surfaces.length) text += " The checkout also contains " + joinList(surfaces) + ".";
  return text;
}

function joinList(items) {
  if (!items.length) return "";
  if (items.length === 1) return items[0];
  if (items.length === 2) return items[0] + " and " + items[1];
  return items.slice(0, -1).join(", ") + ", and " + items[items.length - 1];
}
</script>
</body>
</html>
